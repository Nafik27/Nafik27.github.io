name: Production Monitoring V2 CI

on:
  push:
    paths:
      - "projects/production-monitoring-dashboard/v2/**"
      - ".github/workflows/production-monitoring-v2-ci.yml"
  pull_request:
    paths:
      - "projects/production-monitoring-dashboard/v2/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/production-monitoring-dashboard/v2/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/production-monitoring-dashboard/v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
