services:
  - type: web
    name: production-monitoring-api
    runtime: python
    rootDir: projects/production-monitoring-dashboard/v2/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: production-monitoring-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false

databases:
  - name: production-monitoring-db
    plan: free
    databaseName: production_monitoring
