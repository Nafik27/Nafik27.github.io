services:
  backend:
    build: ./backend
    container_name: production-monitoring-api
    ports:
      - "8000:8000"
    volumes:
      - production_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: production-monitoring-ui
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  production_data:
